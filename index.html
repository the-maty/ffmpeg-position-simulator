<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Blur Area Builder | HEVC Optimized</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="container">
    <h2>FFmpeg Blur Area Builder (HEVC Optimized)</h2>

    <div class="controls">
        <div class="control-group">
            <strong>Nastavení souborů a videa:</strong><br>
            
            <div class="input-row">
                <span class="input-label">Video file:</span>
                <input type="text" id="videoName" value="input" class="full-width" placeholder="Název bez koncovky">
                <select id="videoExt" class="ext-select">
                    <option value=".mkv">.mkv</option>
                    <option value=".mp4">.mp4</option>
                    <option value=".mov">.mov</option>
                </select>
            </div>
            
            <div class="input-row">
                <span class="input-label">Output file:</span>
                <input type="text" id="outputName" value="output" class="full-width" placeholder="Název bez koncovky">
                <select id="outputExt" class="ext-select">
                    <option value=".mkv">.mkv</option>
                    <option value=".mp4">.mp4</option>
                </select>
            </div>
            
            <div style="margin-top: 10px;">
                Rozlišení videa: <input type="number" id="videoWidth" value="1920" style="width: 70px;"> x 
                <input type="number" id="videoHeight" value="1080" style="width: 70px;"><br>
                Síla rozmazání: <input type="number" id="blurRadius" value="13" style="width: 60px;">
            </div>
        </div>

        <div class="control-group">
            <strong>1. Zjistěte BPS video stopy:</strong><br>
            <input type="text" id="probeCommand" readonly style="width: 100%;">
            
            <div style="margin-top: 15px;">
                <strong>2. Vložte zjištěné BPS (skript zachová 80 % pro top kvalitu HEVC):</strong><br>
                <input type="text" id="targetBitrate" value="3013982" style="width: 150px;">
            </div>
        </div>
    </div>

    <div id="stageWrapper">
        <img id="bg" src="template.png" alt="Template" draggable="false">
        <div id="selection"></div>
    </div>

    <textarea id="output" readonly></textarea><br>
    <button id="copyBtn">Zkopírovat příkaz</button>

    <div class="footer">
        &copy; 2026 Vytvořil <a href="https://matydev.eu" target="_blank" rel="noopener noreferrer">Maty</a>
    </div>
</div>

</body>
</html>
